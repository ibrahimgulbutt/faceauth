[package]
name = "faceauth-cli"
description = "Command-line tool for FaceAuth"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
faceauth-core = { path = "../faceauth-core" }
clap = { version = "4.0", features = ["derive"] }
