[workspace]
members = [
    "faceauth-core",
    "faceauthd",
    "pam_faceauth",
    "faceauth-cli",
    "faceauth-gui",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ibrahimgulbutt/faceauth"

[profile.release]
lto = "thin"
codegen-units = 4
